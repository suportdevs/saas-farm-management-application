# Production stack for HerdSphere:
#   APP_SECRET=… WEB_URL=https://app.example.com docker compose -f docker-compose.prod.yml up -d --build
#
# Set secrets in a root .env file or the environment (APP_SECRET is required).
# Everything else (SMTP_*, STRIPE_*, FARM_*, OAuth…) is read from apps/api/.env
# when present; values set below take precedence.
name: herdsphere-prod

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgres://${POSTGRES_USER:-herdsphere}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-herdsphere}
  WEB_URL: ${WEB_URL:-http://localhost:3000}
  APP_SECRET: ${APP_SECRET:?Set APP_SECRET (32+ random chars)}
  APP_NAME: ${APP_NAME:-HerdSphere}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-herdsphere}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-herdsphere}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-herdsphere} -d ${POSTGRES_DB:-herdsphere}']
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published: only reachable by the api and worker containers.

  api:
    image: herdsphere-api:${IMAGE_TAG:-latest}
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    env_file:
      - path: apps/api/.env
        required: false
    environment:
      <<: *api-env
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Shared counters so rate limits hold across replicas.
      RATE_LIMIT_STORE: postgres
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4000/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    # Not published: only reachable by the web container.

  # Optional dedicated job worker (emails, trial reminders, Stripe syncs). To use it,
  # set RUN_WORKER=false for `api` and start the profile:
  #   docker compose -f docker-compose.prod.yml --profile worker up -d
  worker:
    profiles: [worker]
    image: herdsphere-api:${IMAGE_TAG:-latest}
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    env_file:
      - path: apps/api/.env
        required: false
    environment:
      <<: *api-env
    command: ['node', 'dist/worker.js']

  web:
    image: herdsphere-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:4000
        NEXT_PUBLIC_APP_NAME: ${APP_NAME:-HerdSphere}
        NEXT_PUBLIC_SITE_URL: ${WEB_URL:-http://localhost:3000}
        NEXT_PUBLIC_AUTH_LAYOUT: ${AUTH_LAYOUT:-split-left}
        NEXT_PUBLIC_SALES_EMAIL: ${SALES_EMAIL:-sales@herdsphere.app}
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    environment:
      # Server components call the API directly over the internal network.
      API_URL: http://api:4000
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - '${WEB_PORT:-3000}:3000'

volumes:
  pgdata:
