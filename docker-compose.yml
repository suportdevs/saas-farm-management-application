# Local development services for HerdSphere — `npm run db:up`
#   Postgres  localhost:${POSTGRES_PORT:-5434}   (databases: herdsphere, herdsphere_test)
#   Mailpit   SMTP localhost:${MAILPIT_SMTP_PORT:-1026} · inbox http://localhost:${MAILPIT_UI_PORT:-8026}
# Host ports are overridable (e.g. POSTGRES_PORT=5432 npm run db:up) so this stack
# can run next to other projects' containers.
name: herdsphere

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: herdsphere
      POSTGRES_PASSWORD: herdsphere
      POSTGRES_DB: herdsphere
    ports:
      - '${POSTGRES_PORT:-5434}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on an empty volume: creates the test database.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U herdsphere -d herdsphere']
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches every email the app sends.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1026}:1025'
      - '${MAILPIT_UI_PORT:-8026}:8025'

volumes:
  pgdata:
